worker_processes auto;
pid /tmp/teamnav-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/teamnav-client-body;
    fastcgi_temp_path /tmp/teamnav-fastcgi;
    proxy_temp_path /tmp/teamnav-proxy;
    scgi_temp_path /tmp/teamnav-scgi;
    uwsgi_temp_path /tmp/teamnav-uwsgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    map $uri $sensitive_client {
        default "";
        ~^/api/v1/account/(login|register)$ $binary_remote_addr;
        ~^/api/v1/admin/session$ $binary_remote_addr;
        ~^/api/v1/public/sites/[^/]+/(unlock|reports)$ $binary_remote_addr;
    }

    limit_req_zone $sensitive_client zone=sensitive_endpoints:10m rate=10r/m;

    server {
        listen 8080;
        server_name _;
        client_max_body_size 10m;

        location /api/ {
            limit_req zone=sensitive_endpoints burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location /health/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
