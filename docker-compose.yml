services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: teamnav
      POSTGRES_USER: teamnav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamnav}
    volumes:
      - teamnav-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamnav -d teamnav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql+asyncpg://teamnav:${POSTGRES_PASSWORD:-teamnav}@postgres:5432/teamnav
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  teamnav-postgres:
