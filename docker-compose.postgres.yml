services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: teamnav
      POSTGRES_USER: teamnav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - teamnav-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamnav -d teamnav"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    environment:
      DATABASE_URL: postgresql+asyncpg://teamnav:${POSTGRES_PASSWORD}@postgres:5432/teamnav
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  teamnav-postgres:
