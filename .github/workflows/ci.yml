name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "apps/api[dev]"
      - run: ruff check app tests alembic
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: pip install -e "apps/api[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  containers:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-secret-key-with-at-least-32-characters
      ADMIN_TOKEN: ci-admin-token-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.postgres.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.mysql.yml config --quiet
      - name: Smoke test SQLite
        run: |
          trap 'docker compose ps; docker compose logs --no-color' ERR
          docker compose up -d --build --wait
          curl --fail --silent --show-error http://localhost:3000/health/ready
          docker compose down --volumes
      - name: Smoke test PostgreSQL
        run: |
          trap 'docker compose -f docker-compose.yml -f docker-compose.postgres.yml ps; docker compose -f docker-compose.yml -f docker-compose.postgres.yml logs --no-color' ERR
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build --wait
          curl --fail --silent --show-error http://localhost:3000/health/ready
          docker compose -f docker-compose.yml -f docker-compose.postgres.yml down --volumes
      - name: Smoke test MySQL
        run: |
          trap 'docker compose -f docker-compose.yml -f docker-compose.mysql.yml ps; docker compose -f docker-compose.yml -f docker-compose.mysql.yml logs --no-color' ERR
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build --wait
          curl --fail --silent --show-error http://localhost:3000/health/ready
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml down --volumes

  publish:
    needs: [backend, web, e2e, containers]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/teamnav-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
