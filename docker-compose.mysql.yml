services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: teamnav
      MYSQL_USER: teamnav
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - teamnav-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    environment:
      DATABASE_URL: mysql+asyncmy://teamnav:${MYSQL_PASSWORD}@mysql:3306/teamnav?charset=utf8mb4
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  teamnav-mysql:
